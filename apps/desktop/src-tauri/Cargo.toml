[package]
name = "pit-stop-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "pit-stop-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros", "io-util"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
pit-stop-core = { path = "../../../crates/pit-stop-core" }
pit-stop-integrations = { path = "../../../crates/pit-stop-integrations" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

