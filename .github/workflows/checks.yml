name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.18.3
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:visual:install
      - run: pnpm test:visual
      - run: pnpm build
      - run: node scripts/package-helper.mjs
      - run: cargo test --workspace --locked
      - run: pnpm --filter desktop tauri build --no-bundle
